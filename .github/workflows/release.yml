name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  ROOT: saturn-client/saturn

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.v.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "list=$(jq -c . ${{ env.ROOT }}/mc-versions.json)" >> "$GITHUB_OUTPUT"

  mod:
    needs: versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: ${{ fromJson(needs.versions.outputs.list) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: current }
      - name: Build ${{ matrix.mc }}
        working-directory: ${{ env.ROOT }}/mod
        run: gradle build -Pmc=${{ matrix.mc }} --no-daemon
      - run: mkdir out && cp "${{ env.ROOT }}/mod/build/libs/saturn-${{ matrix.mc }}.jar" out/
      - uses: actions/upload-artifact@v4
        with:
          name: saturn-${{ matrix.mc }}
          path: out/*.jar

  launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: saturn-client/saturn/launcher/src-tauri }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build launcher
        working-directory: ${{ env.ROOT }}/launcher
        run: npx --yes @tauri-apps/cli@2 build
        env:
          SATURN_REPO: ${{ github.repository }}
      - name: Collect
        run: |
          New-Item -ItemType Directory out | Out-Null
          Copy-Item "${{ env.ROOT }}/launcher/src-tauri/target/release/saturn-launcher.exe" out/Saturn-Launcher.exe
          Copy-Item "${{ env.ROOT }}/launcher/src-tauri/target/release/bundle/nsis/*.exe" out/
      - uses: actions/upload-artifact@v4
        with:
          name: launcher
          path: out/*.exe

  release:
    needs: [mod, launcher]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
