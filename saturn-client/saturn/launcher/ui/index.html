<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Saturn</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside>
    <div class="brand"><span class="planet"></span><b>SATURN</b></div>
    <div class="nav on">Spielen</div>
    <div class="foot" id="foot">Verbinde …</div>
  </aside>
  <main>
    <h1>Minecraft-Version</h1>
    <p class="sub">Saturn und Fabric API werden automatisch installiert und bei jedem Klick auf den Button aktualisiert.</p>
    <div id="versions" class="versions"></div>
    <div class="actions">
      <button id="install" class="primary" disabled>Installieren / Aktualisieren</button>
      <button id="play">Minecraft Launcher öffnen</button>
    </div>
    <div id="status" class="status"></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
