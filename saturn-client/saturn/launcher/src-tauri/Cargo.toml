[package]
name = "saturn-launcher"
version = "1.0.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# klein & schnell: die Launcher-.exe bleibt wenige MB groß
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
