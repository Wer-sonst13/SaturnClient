<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Saturn</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="splash"><span class="planet big"></span><b>SATURN</b></div>

  <header id="top" data-tauri-drag-region>
    <div class="logo" data-tauri-drag-region><span class="planet"></span><b>Saturn</b></div>
    <nav id="nav">
      <button data-act="nav" data-page="play">Spielen</button>
      <button data-act="nav" data-page="mods">Mods</button>
      <button data-act="nav" data-page="accounts">Konto</button>
      <button data-act="nav" data-page="settings">Einstellungen</button>
    </nav>
    <div class="grow" data-tauri-drag-region></div>
    <div id="chip" class="chip"></div>
    <div class="wc">
      <button id="wmin" title="Minimieren">&minus;</button>
      <button id="wmax" title="Maximieren">&#9633;</button>
      <button id="wclose" class="x" title="Schließen">&times;</button>
    </div>
  </header>

  <div id="layout">
    <aside>
      <div class="side-h"><span>INSTANZEN</span><span id="count" class="count">0</span></div>
      <input id="q" class="input" placeholder="Instanzen durchsuchen" autocomplete="off">
      <div id="list"></div>
      <button class="newbtn" data-act="newInst">+ Neue Instanz</button>
    </aside>
    <main id="page"></main>
  </div>

  <div id="modal" class="modal hidden"></div>
  <div id="toast" class="toast hidden"></div>
  <script src="app.js"></script>
</body>
</html>
